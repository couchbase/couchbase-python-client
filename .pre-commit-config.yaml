# Notes and scripts that never ship, kept out of every hook.
exclude: ^\.ai_discussions/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-toml
      - id: check-merge-conflict
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.6
    hooks:
      - id: clang-format
        files: src/.*\.(cxx|hxx)$
        exclude: ^deps/
  - repo: https://github.com/hhatto/autopep8
    # Same rule as mypy below: keep in step with `autopep8` in dev_requirements.txt.  This
    # hook rewrites files, so a skew means the gate reformats differently than local.
    rev: v2.3.2
    hooks:
      - id: autopep8
        exclude: ^(deps/|src/)
  - repo: https://github.com/pycqa/flake8
    rev: 5.0.4
    hooks:
      - id: flake8
        exclude: |
          (?x)^(
              deps/|
              src/|
              simple_acouchbase.py|
              simple_couchbase.py|
              simple_txcouchbase.py|
              couchbase_kv_tests.py|
              examples/
          )
        args:
          [
            --max-line-length=120,
            --max-complexity=10
          ]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with `ruff` in dev_requirements.txt.  Rules and scope are in [tool.ruff] in
    # pyproject.toml, which selects only the annotation-syntax rules for now.
    rev: v0.16.9
    hooks:
      - id: ruff-check
  - repo: https://github.com/pre-commit/mirrors-mypy
    # Keep this rev in step with `mypy` in dev_requirements.txt.  The hook runs in its own
    # isolated env, so a skew here means the gate enforces a different mypy than the one
    # anyone runs locally, and the two can disagree on what passes.
    rev: v2.3.1
    hooks:
      - id: mypy
        # Scope, settings and per-module overrides all live in [tool.mypy] in
        # pyproject.toml.  Passing the four trees here as well would be redundant, but
        # pre-commit hands the hook a list of changed files and mypy would then check
        # only those, ignoring `files`.  --config-file plus passing no filenames keeps
        # every run checking the whole configured scope.
        pass_filenames: false
        args: [--config-file=pyproject.toml]
        # mypy runs in its own isolated env, so anything it needs to import for types has
        # to be repeated here; it cannot see dev_requirements.txt.
        additional_dependencies:
          - types-requests~=2.32
          - pytest~=8.3.5
          - pytest-asyncio~=1.1
          - Twisted~=24.7
          - opentelemetry-api~=1.22

  - repo: local
    hooks:
      - id: audit-type-ignores
        name: audit type-ignore suppressions in the test trees
        # mypy enforces that the annotations are right; this enforces that the escapes
        # from them stay accountable.  Every `# type: ignore` in the test trees has
        # to name its error code, and has to carry the PYCBC key that will retire it
        # unless it is permanent.  Rationale and the allowlist of permanent ones are in
        # the module docstring.
        entry: python tools/audit_type_ignores.py
        language: python
        # The script walks the configured trees itself.  Passing changed filenames would
        # let a suppression added in one commit hide behind a later commit that does not
        # touch that file.
        pass_filenames: false
        files: ^(tests/|(a|tx)?couchbase/tests/|tools/audit_type_ignores\.py)
      - id: check-type-comments
        name: no type comments in the SDK packages
        # Rationale in the module docstring.
        entry: python tools/check_type_comments.py
        language: python
        pass_filenames: false
        files: ^((a|tx)?couchbase/.*\.py|tools/check_type_comments\.py)$
      - id: check-protocol-free-tests
        name: shared tests do not reach into the classic protocol
        # A test that runs on every protocol may not import classic or its binding, or read an
        # object's executor, stream or connection, unless it is declared classic-only.
        # Rationale in the module docstring.
        entry: python tools/check_protocol_free_tests.py
        language: python
        pass_filenames: false
        files: ^(tests/|(a|tx)?couchbase/tests/|tools/check_protocol_free_tests\.py)
      - id: check-binding-free-imports
        name: modules outside classic import without the native extension, against a baseline
        # Each module is imported in an interpreter that refuses the package's extensions, so it
        # needs what the modules import at load: typing-extensions below 3.13, Twisted for
        # txcouchbase and the OpenTelemetry API for `couchbase.otel_tracer`.  A module that fails
        # for want of one is reported as unchecked, not passed.  Rationale in the module docstring.
        entry: python tools/check_binding_free_imports.py
        language: python
        additional_dependencies: ['typing-extensions>=4.14', 'Twisted~=24.7', 'opentelemetry-api~=1.22']
        pass_filenames: false
        files: ^((a|tx)?couchbase/.*\.py|tools/check_binding_free_imports\.py|tools/binding_free_imports_baseline\.txt)$
      - id: check-api-parity
        name: the three public APIs agree on their facades, against a list of explained differences
        # Imports the facades, so it needs what they import at load, as the hook above does.
        # Rationale in the module docstring.
        entry: python tools/check_api_parity.py
        language: python
        additional_dependencies: ['typing-extensions>=4.14', 'Twisted~=24.7']
        pass_filenames: false
        files: ^((a|tx)?couchbase/.*\.py|tools/check_api_parity\.py|tools/api_parity_exemptions\.txt)$
      - id: check-public-api
        name: every public module's __all__ and bindings agree with the public inventory
        # Imports every public module, so it needs what they import at load, as the hooks above do,
        # the OpenTelemetry API included.  Rationale in the module docstring.
        entry: python tools/check_public_api.py
        language: python
        additional_dependencies: ['typing-extensions>=4.14', 'Twisted~=24.7', 'opentelemetry-api~=1.22', 'PyYAML~=6.0']
        pass_filenames: false
        files: ^((a|tx)?couchbase/.*\.py|examples/.*\.py|tools/check_public_api\.py|tools/public_api\.yaml)$
      - id: check-capabilities
        name: every capability is declared, checked and reached through require()
        # Reads source only, so it needs nothing installed.  Rationale in the module docstring.
        entry: python tools/check_capabilities.py
        language: python
        pass_filenames: false
        files: ^((a|tx)?couchbase/.*\.py|tools/check_capabilities\.py|tools/check_api_parity\.py)$

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        exclude: |
          (?x)^(
              deps/|
              src/|
              examples/txcouchbase/
          )
        args:
          [
            "--multi-line 1",
            "--force-grid-wrap 3",
            "--use-parentheses True",
            "--ensure-newline-before-comments True",
            "--line-length 120",
            "--order-by-type True"
          ]
  - repo: local
    hooks:
      - id: autogen-operations
        name: operations table against the Op enum it generates
        entry: python -m tools.autogen operations check
        language: python
        additional_dependencies: [click, jinja2, pyyaml]
        pass_filenames: false
        files: ^(tools/autogen/(cli\.py|(config|templates|core|commands)/operations[./])|couchbase/common/_operations\.py$)
  - repo: local
    hooks:
      - id: docgen
        name: API reference pages against the public inventory and the docs layout
        entry: python -m tools.docgen check
        language: python
        # Imports every documented module to choose each name's directive, so it needs what they
        # import at load, as check-public-api does.  No native binding: the generator does not read it.
        additional_dependencies: [click, jinja2, pyyaml, 'typing-extensions>=4.14', 'Twisted~=24.7',
                                  'opentelemetry-api~=1.22']
        pass_filenames: false
        files: ^((a|tx)?couchbase/.*\.py|tools/docgen/|tools/check_public_api\.py|tools/public_api\.yaml|docs/reference/)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        exclude: |
          (?x)^(
              deps/|
              src/|
              acouchbase/tests/|
              txcouchbase/tests/|
              couchbase/tests/|
              tests/|
              tools/|
              simple_acouchbase.py|
              simple_couchbase.py|
              simple_txcouchbase.py|
              couchbase_kv_tests.py|
              couchbase_version.py
          )
        args:
          [
              --quiet
          ]

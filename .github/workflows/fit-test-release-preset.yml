name: Run FIT Testing (Release preset)

on:
  schedule:
    - cron: '0 6 * * SAT'

  workflow_dispatch:
    inputs:
      performer_image_version:
        description: Version (docker image tag) of the python-fit-performer image to test against.
        required: false
        type: string
        default: main

permissions:
  id-token: write
  contents: read
  checks: write

jobs:
  fit:
    uses: ./.github/workflows/fit-test.yml
    with:
      preset: ${{ vars.FIT_CLI_RELEASE_PRESET || 'op-multi-release' }}
      performer_image_version: ${{ inputs.performer_image_version }}

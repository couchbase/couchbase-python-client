[build-system]
requires = [
  # 70.1 is when bdist_wheel moved into setuptools proper; see the fallback
  # import in pycbc_build_setup.py. Also comfortably new enough to treat
  # setup.py's SPDX `license="Apache-2.0"` as a real license expression.
  "setuptools>=70.1",
  "wheel",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
#addopts = "-ra -q"
testpaths = [
    "tests",
    "acouchbase/tests",
    "couchbase/tests",
    "txcouchbase/tests",
]
python_classes = [
    "*Tests"
]
python_files = [
    "*_t.py"
]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "pycbc_couchbase: marks a test for the couchbase API (deselect with '-m \"not pycbc_couchbase\"')",
    "pycbc_acouchbase: marks a test for the acouchbase API (deselect with '-m \"not pycbc_acouchbase\"')",
    "pycbc_txcouchbase: marks a test for the txcouchbase API (deselect with '-m \"not pycbc_txcouchbase\"')",
    "pycbc_slow_mgmt: marks a test as a management API test that is slow",
    "unsupported_protocol(*protocols): skip this test under any of the given TestProtocol values",
    "testgen_exclude(*apis, reason=...): do not generate this test for the named APIs",
]

[tool.autopep8]
max_line_length = 120
in-place = true
recursive = true

[tool.mypy]
# Kept here rather than in a separate mypy.ini so tool config stays in one file, matching
# autopep8 / isort / pytest above.  Semantically identical to the [mypy] ini form.
# An SDK module is promoted onto the gate by naming its file here.  A per-module
# `follow_imports = "normal"` override does not promote it: the override leaves the module's
# errors unreported, and naming the file reports them.
files = ["tests", "couchbase/tests", "acouchbase/tests", "txcouchbase/tests",
         "couchbase/common/result.py", "couchbase/common/n1ql.py",
         "couchbase/common/analytics.py", "couchbase/common/search.py",
         "couchbase/common/search_queries.py", "couchbase/protocol/classic/_result.py",
         "couchbase/protocol/classic/_metadata.py",
         "couchbase/common/config_profiles.py", "couchbase/common/option_enums.py",
         "couchbase/protocol/classic/_error_mapping.py", "couchbase/common/exceptions.py",
         "couchbase/common/options.py", "couchbase/common/management",
         "couchbase/common/subdocument.py", "couchbase/protocol/classic/_subdocument.py",
         "couchbase/common/diagnostics.py", "couchbase/common/views.py",
         "couchbase/common/_option_spec.py", "couchbase/protocol/classic/_streaming.py",
         "couchbase/common/_operations.py", "couchbase/protocol/classic/_bindings.py",
         "couchbase/common/_streaming.py", "acouchbase/protocol/classic/_streaming.py",
         "couchbase/protocol/classic/_range_scan.py", "acouchbase/protocol/classic/_range_scan.py",
         "txcouchbase/protocol/classic/_streaming.py", "txcouchbase/protocol/classic/_deferred.py",
         "couchbase/result.py", "acouchbase/result.py",
         "couchbase/protocol/classic/_pycbc_core", "couchbase/common/warnings.py",
         "couchbase/common/_supportability.py", "couchbase/common/_option_diagnostics.py",
         "couchbase/common/_option_args.py", "couchbase/protocol/classic/_wire.py",
         "couchbase/protocol/classic/_option_wire.py",
         "couchbase/common/_transforms.py", "couchbase/common/protocol.py",
         "couchbase/common/kv_range_scan.py", "couchbase/common/search_scoring.py",
         "couchbase/common/vector_search.py", "couchbase/common/search_request.py",
         "couchbase/common/_observability", "couchbase/protocol/classic/_n1ql.py",
         "couchbase/protocol/classic/_analytics.py", "couchbase/protocol/classic/_views.py",
         "couchbase/protocol/classic/_search.py", "couchbase/protocol/classic/_binding_map.py",
         "couchbase/protocol/classic/_client_adapter.py", "couchbase/protocol/classic/_cluster_impl.py",
         "couchbase/protocol/classic/_cluster_req_builder.py",
         "couchbase/protocol/classic/_cluster_types.py", "couchbase/protocol/classic/_bucket_impl.py",
         "couchbase/protocol/classic/_bucket_req_builder.py",
         "couchbase/protocol/classic/_bucket_types.py", "couchbase/protocol/classic/_scope_impl.py",
         "couchbase/protocol/classic/_scope_req_builder.py",
         "couchbase/protocol/classic/_scope_types.py",
         "couchbase/protocol/classic/_collection_impl.py",
         "couchbase/protocol/classic/_legacy_datastructures.py",
         "couchbase/protocol/classic/_collection_req_builder.py",
         "couchbase/protocol/classic/_collection_types.py",
         "couchbase/protocol/classic/_collection_multi_req_builder.py",
         "couchbase/protocol/classic/_collection_multi_types.py",
         "couchbase/common/_logging.py", "couchbase/protocol/classic/_logging_config.py",
         "couchbase/protocol/classic/_transactions_req_builder.py",
         "couchbase/protocol/classic/_transactions_impl.py",
         "acouchbase/protocol/classic/_transactions_impl.py",
         "couchbase/common/_interfaces", "couchbase/common/_capabilities.py",
         "couchbase/protocol/classic/_capabilities.py", "couchbase/common/_registry.py",
         "couchbase/protocol/classic/_registry.py",
         "couchbase/transactions/transactions.py",
         "acouchbase/transactions/transactions.py", "couchbase/transactions/transactions_get_multi.py",
         "couchbase/datastructures.py", "acouchbase/datastructures.py",
         "acouchbase/protocol/classic/_client_adapter.py",
         "acouchbase/protocol/classic/_cluster_impl.py", "acouchbase/protocol/classic/_bucket_impl.py",
         "acouchbase/protocol/classic/_scope_impl.py",
         "acouchbase/protocol/classic/_collection_impl.py",
         "txcouchbase/protocol/classic/_cluster_impl.py", "txcouchbase/protocol/classic/_bucket_impl.py",
         "txcouchbase/protocol/classic/_scope_impl.py",
         "txcouchbase/protocol/classic/_collection_impl.py",
         "couchbase/protocol/classic/_management", "acouchbase/protocol/classic/_management",
         "txcouchbase/protocol/classic/_management",
         "couchbase/common/_utils.py", "couchbase/common/auth.py",
         "couchbase/common/serializer.py", "couchbase/common/transcoder.py",
         "couchbase/common/_tracing.py", "couchbase/common/otel_tracer.py",
         "couchbase/common/_durability.py", "couchbase/common/durability.py",
         "couchbase/common/mutation_state.py", "couchbase/common/encryption",
         "couchbase/common/transactions/transaction_get_result.py",
         "couchbase/common/transactions/transaction_keyspace.py",
         "couchbase/common/transactions/transaction_query_results.py"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Every `# type: ignore` here suppresses a defect that is fixed somewhere other than the
# line holding the ignore: an annotation in the SDK tree, or a test defect with a ticket of
# its own.  Both are temporary, and neither fix is made by anyone reading this file.  This
# turns "remember to delete it" into a hard failure naming the exact line, the moment the
# ignore stops being needed.
warn_unused_ignores = true

# A bare `# type: ignore` silences every error the line will ever produce rather than the
# one its author saw, so what it suppresses is whatever the file grows into.  Requiring the
# code keeps each suppression pinned to the defect it was written for.
#
# `tools/audit_type_ignores.py` holds the same requirement for the test trees, and both
# halves earn their place: the audit reads the source, so it can see that the brackets are
# empty but not what belongs inside them.  mypy has the error in hand when it reports this,
# so it names the code as well.
enable_error_code = ["ignore-without-code"]

# The SDK is annotated in the SDK tree, not here.  `silent` still *analyzes* these modules,
# so attribute and arity checking against the SDK works today; it only suppresses errors
# reported inside them.  Do not use `skip`, which would make the whole SDK `Any` and
# defeat the point of typing cb_env at all.
#
# All three api trees, and each bare module name as well as its submodules.  A pattern of
# `couchbase.*` alone does not match `couchbase` itself, and covering only the sync tree
# leaves acouchbase and txcouchbase reporting: between them that was 410 of 876 errors on
# the first run of this config, all of it SDK noise.
#
# The three `files` trees that sit inside these patterns need no counter-override.
# `follow_imports` governs modules mypy reaches by import; a path named in `files` is
# checked, and its errors reported, whatever it says.  Measured under mypy 2.3.0 by planting
# a return-value error in each of the three, `_generated` included, and confirming all three
# were reported.
[[tool.mypy.overrides]]
module = ["couchbase", "couchbase.*",
          "acouchbase", "acouchbase.*",
          "txcouchbase", "txcouchbase.*"]
follow_imports = "silent"

# Third-party packages that ship no stubs.  These are test-only dependencies and none of
# them appear in an annotation we care about checking.
[[tool.mypy.overrides]]
module = ["faker.*", "faker_vehicle.*", "faker_vehicle", "xdist.*"]
ignore_missing_imports = true

# Ruff enforces one thing here so far: annotations are spelled the way python_requires>=3.10
# allows, `X | None` and `dict[...]` rather than `Optional[X]` and `Dict[...]`.  flake8, isort and
# autopep8 still own linting, import order and formatting, so `select` names only these rules.
[tool.ruff]
target-version = "py310"
line-length = 120
# pre-commit passes file names, and ruff checks a named file even when `exclude` matches it
# unless this is set.
force-exclude = true
extend-exclude = ["deps", "src", "examples"]

[tool.ruff.lint]
select = ["UP006", "UP007", "UP035", "UP045", "TID251"]

# UP035 rejects importing the aliases PEP 585 replaced, but `Optional` and `Union` are not among
# them, and a `# type:` comment, which ruff does not read, can keep either alive.  Banning the
# import catches every use, the comments included.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Optional".msg = "Write `X | None`."
"typing.Union".msg = "Write `X | Y`."

[tool.isort]
multi_line_output = 1
force_grid_wrap = 3
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
order_by_type = true

# isort infers first-party membership from what is on disk, so tools/testgen/resolver.py
# sorts one way in a checkout that carries the `tests` package and another way in one
# that does not.  Stating the membership makes the sort the same everywhere.
known_first_party = ["tests"]

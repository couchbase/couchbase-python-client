[build-system]
requires = [
  # 70.1 is when bdist_wheel moved into setuptools proper; see the fallback
  # import in pycbc_build_setup.py. Also comfortably new enough to treat
  # setup.py's SPDX `license="Apache-2.0"` as a real license expression.
  "setuptools>=70.1",
  "wheel",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
#addopts = "-ra -q"
testpaths = [
    "tests",
    "acouchbase/tests",
    "couchbase/tests",
    "txcouchbase/tests",
]
python_classes = [
    "*Tests"
]
python_files = [
    "*_t.py"
]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "pycbc_couchbase: marks a test for the couchbase API (deselect with '-m \"not pycbc_couchbase\"')",
    "pycbc_acouchbase: marks a test for the acouchbase API (deselect with '-m \"not pycbc_acouchbase\"')",
    "pycbc_txcouchbase: marks a test for the txcouchbase API (deselect with '-m \"not pycbc_txcouchbase\"')",
    "pycbc_slow_mgmt: marks a test as a management API test that is slow",
    "unsupported_protocol(*protocols): skip this test under any of the given TestProtocol values",
    "testgen_exclude(*apis, reason=...): do not generate this test for the named APIs",
]

[tool.autopep8]
max_line_length = 120
in-place = true
recursive = true

[tool.mypy]
# Kept here rather than in a separate mypy.ini so tool config stays in one file, matching
# autopep8 / isort / pytest above.  Semantically identical to the [mypy] ini form.
# `couchbase/_version.py` is written by the build, so the check needs a built tree.
files = ["tests", "couchbase", "acouchbase", "txcouchbase"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Every `# type: ignore` here suppresses a defect that is fixed somewhere other than the
# line holding the ignore: an annotation in the SDK tree, or a test defect with a ticket of
# its own.  Both are temporary, and neither fix is made by anyone reading this file.  This
# turns "remember to delete it" into a hard failure naming the exact line, the moment the
# ignore stops being needed.
warn_unused_ignores = true

# A bare `# type: ignore` silences every error the line will ever produce rather than the
# one its author saw, so what it suppresses is whatever the file grows into.  Requiring the
# code keeps each suppression pinned to the defect it was written for.
#
# `tools/audit_type_ignores.py` holds the same requirement for the test trees, and both
# halves earn their place: the audit reads the source, so it can see that the brackets are
# empty but not what belongs inside them.  mypy has the error in hand when it reports this,
# so it names the code as well.
enable_error_code = ["ignore-without-code"]

# Third-party packages that ship no stubs.  These are test-only dependencies and none of
# them appear in an annotation we care about checking.
[[tool.mypy.overrides]]
module = ["faker.*", "faker_vehicle.*", "faker_vehicle", "xdist.*"]
ignore_missing_imports = true

# The FIT performer's protobuf code, generated by `tools/fit_performer/bin/generate.sh` into a
# gitignored directory that `tools/fit_performer/bin/typecheck.sh` puts on the search path, so it is
# imported under these top-level names.  The `.pyi` stubs type the messages and the service the
# performer uses; what is wrong inside generated code is not ours to fix.
[[tool.mypy.overrides]]
module = [
    "hooks.*", "meta.*", "metrics.*", "observability.*", "performer.*", "performer_pb2",
    "performer_pb2_grpc", "run.*", "sdk.*", "shared.*", "streams.*", "transactions.*",
]
ignore_errors = true

# Ruff enforces two things here: annotations are spelled the way python_requires>=3.10 allows,
# `X | None` and `dict[...]` rather than `Optional[X]` and `Dict[...]`, and the user-facing package
# has Google-style docstrings, the style Sphinx's napoleon reads.  flake8, isort and autopep8 still
# own linting, import order and formatting, so `select` names only these rules.
[tool.ruff]
target-version = "py310"
line-length = 120
# pre-commit passes file names, and ruff checks a named file even when `exclude` matches it
# unless this is set.
force-exclude = true
extend-exclude = ["deps", "src", "examples"]

[tool.ruff.lint]
select = ["UP006", "UP007", "UP035", "UP045", "TID251", "D"]
# A class's docstring documents its constructor's arguments, so `__init__` and the other dunders
# need none of their own.  Module docstrings are not required.
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstrings are checked on the user-facing package: not the tests, the tools, the protocol
# implementations or a private module.
"{tests,tools,docs}/**" = ["D"]
"**/{tests,protocol}/**" = ["D"]
"**/_[!_]*.py" = ["D"]
"{setup,conftest,couchbase_version,pycbc_build_setup}.py" = ["D"]

# UP035 rejects importing the aliases PEP 585 replaced, but `Optional` and `Union` are not among
# them, and a `# type:` comment, which ruff does not read, can keep either alive.  Banning the
# import catches every use, the comments included.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Optional".msg = "Write `X | None`."
"typing.Union".msg = "Write `X | Y`."

[tool.isort]
multi_line_output = 1
force_grid_wrap = 3
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
order_by_type = true

# isort infers first-party membership from what is on disk, so tools/testgen/resolver.py
# sorts one way in a checkout that carries the `tests` package and another way in one
# that does not.  Stating the membership makes the sort the same everywhere.
known_first_party = ["tests"]

# The FIT performer's generated protobuf modules, imported under the top-level names the mypy
# override above lists.  Naming them keeps their sort off the disk as well, where `src/transactions`
# would pass `transactions` for first-party, and gives them one block of their own after the SDK's.
known_fit_generated = [
    "hooks", "meta", "metrics", "observability", "performer", "performer_pb2", "performer_pb2_grpc",
    "run", "sdk", "shared", "streams", "transactions",
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "FIT_GENERATED", "LOCALFOLDER"]

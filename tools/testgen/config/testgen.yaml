# Which suites generate, and for which APIs.
#
# The sync suite under couchbase/tests_v2/ is the single source.  Everything here decides
# what is made from it and where the result lands; no code in tools/testgen knows the name
# of any suite, service or SDK feature.
#
# `targets` defaults to both generated APIs.  Every override below is a *capability* fact
# about the SDK, checked rather than assumed, and each one is a one-line change if that ever
# stops being true.  Reading the overrides is meant to be the fastest way to see where the
# three API trees genuinely differ.
#
# Two mechanisms sit alongside this file and are deliberately not in it, because both are
# facts about one class or one test rather than about a suite:
#
#   testgen_exclude   a decorator at the class or test it applies to, for the case where a
#                     suite generates but one part of it cannot
#   sidecar           a hand-written file merged into the generated output, for the case
#                     where an API needs a test that has no sync form to be generated from
#
# The question that decides a sidecar is whether there is a *generated* file to merge into,
# not whether the source has a sync counterpart.  couchbase/tests_v2/streaming_helpers_t.py
# has a sync source and generates nothing, so its acouchbase counterpart is a standalone
# hand-written file rather than a sidecar.

# Every source below is relative to the repository root and lives under this directory,
# which is also the directory the completeness check at the foot of the file scans.
source_dir: couchbase/tests_v2

output:
  acouchbase: acouchbase/tests_v2/_generated
  txcouchbase: txcouchbase/tests_v2/_generated

defaults:
  targets: [acouchbase, txcouchbase]

suites:

  # ---- Key-value -----------------------------------------------------------------------------------

  - source: couchbase/tests_v2/binary_collection_t.py

  - source: couchbase/tests_v2/binary_durability_t.py

  - source: couchbase/tests_v2/collection_t.py

  # txcouchbase has no datastructure support to generate against: no txcouchbase/
  # datastructures.py, and no couchbase_list/map/set/queue on its Collection.
  #
  # The deprecated list_/map_/set_/queue_ Collection methods are sync-only, so that suite class
  # carries a class-level testgen_exclude on top of the narrowed target.
  - source: couchbase/tests_v2/datastructures_t.py
    targets: [acouchbase]

  - source: couchbase/tests_v2/durability_t.py

  # No Twisted KV range scan support: TxCollection has no scan() and there is no
  # txcouchbase.kv_range_scan module.
  - source: couchbase/tests_v2/kv_range_scan_t.py
    targets: [acouchbase]

  - source: couchbase/tests_v2/mutation_tokens_t.py

  - source: couchbase/tests_v2/subdoc_t.py

  - source: couchbase/tests_v2/transcoder_t.py

  # ---- Streaming services --------------------------------------------------------------------------

  # Two per-test exclusions carry API facts, both declared at the site: the threading.Thread
  # test, as in query_t, and test_query_timeout under txcouchbase, whose Cluster has no
  # connect() classmethod.
  - source: couchbase/tests_v2/analytics_t.py

  # The sidecar carries the two acouchbase-only regression tests, PYCBC-1471 and PYCBC-1774.
  # Both assert on asyncio semantics, so neither has a sync form to be generated from; see
  # the file's docstring for the bar it has to clear.
  - source: couchbase/tests_v2/query_t.py
    sidecar:
      acouchbase: acouchbase/tests_v2/query_additions_t.py

  # Two exclusions, one per suite class, both named test_search_query_in_thread: a
  # threading.Thread reaches into objects bound to an event loop, so it exercises the loop and
  # not the SDK.  query_t and analytics_t exclude their twins for the same reason.
  - source: couchbase/tests_v2/search_t.py

  # One exclusion, test_view_query_in_thread, for the reason search_t and query_t exclude
  # theirs.
  - source: couchbase/tests_v2/views_t.py

  # ---- Transactions --------------------------------------------------------------------------------

  # The twisted tree has no `transactions` property to race, and both classes carry the
  # exclusion.  Worth generating precisely because the async tree does not inherit the guard it
  # checks: acouchbase/logic/cluster_impl.py holds a second, independent copy of the same
  # double-checked lock.  The suite reaches that copy without a cluster because it patches
  # Transactions on the module the impl came from rather than on a module named in a string
  # literal, which is the one construct here a generated copy could not have followed.
  #
  # The property gates on the connection before it reaches the check-then-set, so the threaded
  # tests stub that guard out and the guard is asserted separately.  Both halves generate: the
  # guard is a second copy in acouchbase/logic/cluster_impl.py, same as the lock it fronts.
  - source: couchbase/tests_v2/transactions_property_race_t.py
    targets: [acouchbase]

  # No Twisted transaction support: there is no txcouchbase.transactions module.
  - source: couchbase/tests_v2/transactions_t.py
    targets: [acouchbase]

  # ---- Management ----------------------------------------------------------------------------------
  # One entry per manager.  This is where the API trees differ most, because a manager can
  # be written for an API without anything ever driving it.

  - source: couchbase/tests_v2/analyticsmgmt_t.py

  - source: couchbase/tests_v2/bucketmgmt_t.py

  - source: couchbase/tests_v2/collectionmgmt_t.py

  # txcouchbase has no eventing surface to generate against.  There is no
  # txcouchbase/management/eventing.py and neither TxCluster nor TxScope has an
  # eventing_functions() accessor, so unlike view_indexes before PYCBC-1901 there is nothing
  # written and merely unreachable; see the note at the top of
  # tests_v2/environments/managers/eventing.py.
  - source: couchbase/tests_v2/eventingmgmt_t.py
    targets: [acouchbase]

  # The collection-level suite class carries a testgen_exclude for txcouchbase, which has no
  # collection.query_indexes() to drive.  The 18 tests behind it still generate elsewhere.
  - source: couchbase/tests_v2/querymgmt_t.py

  - source: couchbase/tests_v2/searchmgmt_t.py

  # test_user_change_password is excluded from txcouchbase, and it is the only place in the tree
  # a suite reaches an SDK manager rather than a framework wrapper.  It has to: change_password
  # acts on whoever the *connection* is authenticated as, so the test builds a second cluster
  # with Cluster.connect(...), a classmethod txcouchbase.cluster.Cluster does not have.  Same
  # exclusion as query_t, for the same reason.
  - source: couchbase/tests_v2/usermgmt_t.py

  - source: couchbase/tests_v2/viewmgmt_t.py

  # ---- Cluster, connection and credentials ---------------------------------------------------------

  - source: couchbase/tests_v2/bucket_t.py

  # ClusterCloseTestSuite is excluded from txcouchbase whole rather than test by test, because
  # all five of its tests open a cluster with Cluster.connect(...).  The sidecar carries the one
  # acouchbase-only close test, which asserts on the async constructor rather than on the event
  # loop: acouchbase.Cluster(...) returns unconnected where the sync one connects, so it has no
  # sync form to be generated from.
  - source: couchbase/tests_v2/cluster_t.py
    sidecar:
      acouchbase: acouchbase/tests_v2/cluster_additions_t.py

  # Only one of connection_t's five classes generates at all.  The four cluster-free classes
  # drive ClusterSettings, which every tree imports from couchbase.logic.cluster_settings,
  # through three thin constructors that forward *options, **kwargs to it identically.
  # Generating them would be 125 tests per tree to check three one-line calls, so the file
  # states that contract once instead, in
  # ClusterOptionsUnitTests.test_every_api_tree_parses_a_connection_the_same_way, which builds
  # all three impls from one options object and compares eight settings fields.
  #
  # ConnectionTestSuite does generate, because what it asserts is what the *core* reports back
  # through cluster._impl.get_connection_info(), and that is per-tree code.  txcouchbase is
  # excluded at both the suite and the concrete class: every test starts from Cluster.connect.
  - source: couchbase/tests_v2/connection_t.py
    targets: [acouchbase]

  # txcouchbase.Cluster has no set_authenticator, and txcouchbase/logic/cluster_impl.py has
  # neither update_credentials nor get_connection_info, so there is nothing for a generated
  # copy to call.  Listed with one target rather than carrying a testgen_exclude because both
  # of its classes would be excluded and one of them for a different reason.
  #
  # JwtAuthenticatorUnitTests is excluded from the acouchbase target at the class.  It is
  # cluster-free and there is no acouchbase.auth: every tree imports JwtAuthenticator from
  # couchbase.auth, so a generated copy would run identical code against identical imports.
  - source: couchbase/tests_v2/credentials_t.py
    targets: [acouchbase]

  # Nothing about rate limiting is API-specific, but the suite drives KV, query and search
  # through a second cluster it opens itself, and txcouchbase.cluster.Cluster has no connect
  # classmethod to open one with.  That would take six of the ten tests, so the suite generates
  # for acouchbase alone rather than carrying six exclusions.
  - source: couchbase/tests_v2/rate_limit_t.py
    targets: [acouchbase]


# Sources under `source_dir` that deliberately generate nothing.  Every *_t.py there has to
# appear either in `suites` above or here, and the loader fails on one that appears in neither,
# so adding a suite forces the decision rather than skipping it in silence.
not_generated:

  # Nothing in these talks to a cluster, and each one is a single class with no TEST_MANIFEST,
  # a manifest being a parity contract and these having no other tree to be in parity with.
  # Three shapes: build a request object, a settings object or an exception and read what it
  # produced; feed a server-shaped dict to a `from_server` or `from_json` classmethod and read
  # what came back; or construct a `_core` type and assert on the object model.  All of it out
  # of modules every API imports unchanged, so a generated copy would run identical code
  # against identical imports.  pycbc_core_t is the strongest case of that: there is one shared
  # library, so a copy would sample the same refcounts.
  #
  # The decode suites are here rather than folded into the management suites they shadow
  # because what they cover is the direction a management suite cannot reach.  Driving a
  # manager exercises the constructors and the outbound `as_dict()`; nothing in it reads a
  # server payload back, and inbound and outbound are not the same shape.
  cluster_free:
    - couchbase/tests_v2/analytics_params_t.py
    - couchbase/tests_v2/bucketmgmt_bucket_settings_t.py
    - couchbase/tests_v2/cluster_req_builder_t.py
    - couchbase/tests_v2/collection_req_builder_t.py
    - couchbase/tests_v2/diagnostics_t.py
    - couchbase/tests_v2/eventingmgmt_function_types_t.py
    - couchbase/tests_v2/exceptions_t.py
    - couchbase/tests_v2/pycbc_core_t.py
    - couchbase/tests_v2/query_params_t.py
    - couchbase/tests_v2/scope_req_builder_t.py
    - couchbase/tests_v2/search_params_t.py
    - couchbase/tests_v2/view_result_types_t.py
    - couchbase/tests_v2/viewmgmt_view_types_t.py
    - couchbase/tests_v2/views_params_t.py

  # Multi-operations are on the sync Collection alone: upsert_multi and its family are defined
  # in couchbase/collection.py and on neither acouchbase nor txcouchbase, so there is nothing
  # for a generated copy to call.
  sync_only_api:
    - couchbase/tests_v2/binary_collection_multi_t.py
    - couchbase/tests_v2/collection_multi_t.py
    - couchbase/tests_v2/durability_multi_t.py

  # stream_next is driven through a stand-in for the request object rather than through a
  # server, and the stand-in is API-specific.  acouchbase carries a hand-written counterpart,
  # not a sidecar, there being no generated file for a sidecar to merge into.
  api_specific_fake:
    - couchbase/tests_v2/streaming_helpers_t.py

  # Both trees have a connection lifecycle and neither can be written from the other's spelling
  # of it: close_bucket is execute_close_bucket_request under acouchbase and returns a future,
  # close_connection is a coroutine, and the connect future two of the async tests are about has
  # no blocking form.  acouchbase carries a hand-written counterpart, not a sidecar, there being
  # no generated file for a sidecar to merge into.  txcouchbase has neither.
  api_specific_surface:
    - couchbase/tests_v2/connection_lifecycle_t.py

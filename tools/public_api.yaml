# The public inventory: per public module, its public names and its compat names.
# docs: true marks a user-facing module, whose public names get a reference page.
# Public is written to the module's __all__. Compat stays bound at that path and only shrinks.
# A name in neither list is private or bound only for the module's own use.
# tools/check_public_api.py holds the tree to it.
# counterparts, at the end, says what acouchbase and txcouchbase have at each couchbase path.


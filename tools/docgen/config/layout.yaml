# The layout of the API reference.  tools/docgen renders it into docs/<output>, which it owns.
#
# Which modules are documented is tools/public_api.yaml's `docs: true`, and what each API has at a
# couchbase path is its `counterparts`.  This file adds a title and an order for each page, the
# pages that gather others, the groups a long page is split into, and the members a page leaves out.
#
# `common` holds the modules the asyncio and Twisted APIs only re-export, so each is described once.
# `apis` holds the modules some API writes its own version of, named by their couchbase path; each
# API renders the ones it has, and links to the synchronous page for the ones it re-exports.
# A page takes `modules`, or `pages` to gather others.  `slug`, its path in the section, defaults to
# the first module's path below couchbase, and to the title for a page of pages.  `groups` split a
# common page of one module, and between them hold each of its public names once.
docs: docs
output: reference
sections:
  common:
    title: Common reference
    intro: |
      The options, results, exceptions and other types shared by every API.  An ``acouchbase`` or
      ``txcouchbase`` module of the same name publishes these same objects.
  couchbase:
    title: Synchronous API
    intro: |
      The ``couchbase`` package: every operation blocks until it completes.  The types its operations take
      and return are in the :doc:`/reference/common/index`.
  acouchbase:
    title: asyncio API
    intro: |
      The ``acouchbase`` package: every operation is a coroutine, run on an asyncio event loop.  The types
      its operations take and return are in the :doc:`/reference/common/index`.
  txcouchbase:
    title: Twisted API
    intro: |
      The ``txcouchbase`` package: every operation returns a Twisted ``Deferred``.  The types its operations
      take and return are in the :doc:`/reference/common/index`.

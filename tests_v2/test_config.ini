; Every value below is shadowed by its environment variable, named in the comment above
; it.  An unset variable leaves the file's value alone, so exporting one is how a single
; run points somewhere else without editing this file.

[realserver]
; Set this to true if there is a real cluster available.  $PYCBC_SERVER_ENABLED
enabled = False
; Reach the cluster over couchbase2 rather than the classic protocol.
; $PYCBC_COUCHBASE2
; is_couchbase2 = False
#Local
; $PYCBC_HOST
host = 127.0.0.1
; $PYCBC_PORT
port = 8091
; $PYCBC_USERNAME
admin_username = Administrator
; The administrative password. This is the password used to
; log into the admin console.  $PYCBC_PASSWORD
admin_password = password
; $PYCBC_BUCKET
bucket_name = default
; If a SASL bucket is being used (i.e. buckets are set up
; per the script, then this is the *bucket* password
; bucket_password sasl_password
; No environment variable, and nothing in tests_v2 reads the loaded value.
bucket_password = password

[gocaves]
; Set this to enabled to use the GoCAVES mock.  $PYCBC_GOCAVES_ENABLED
enabled = True
; Set the version of GoCAVES to use.  $PYCBC_GOCAVES_VERSION
version = v0.0.1-78
; Local path for the GoCAVES mock, if not supplied, will be downloaded.
; $PYCBC_GOCAVES_PATH
; path = gocaves-macos
; Where to download it, if not available.  No environment variable.
url = https://github.com/couchbaselabs/gocaves/releases/download
; Naming a directory captures the mock's own output there, one file per xdist worker.
; Off unless set: nothing reads it, and it is worth having when the mock itself is the
; thing under suspicion.  $PYCBC_GOCAVES_LOG_DIR does the same.
; log_dir = test_logs
